  </div>
  <h3>Thống Kê Chi Tiết 13 Phân Hệ Chức Năng</h3>
  <table>
    <thead><tr><th>STT</th><th>Phân Hệ Chức Năng</th><th>Dải Mã Kịch Bản</th><th>Số Lượng</th><th>Trạng Thái</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>Xác thực & Điều hướng</td><td>TC_001 - TC_015</td><td>15</td><td><span class="badge badge-pass">15/15 PASSED</span></td></tr>
      <tr><td>2</td><td>Thuộc tính sản phẩm</td><td>TC_016 - TC_030</td><td>15</td><td><span class="badge badge-pass">15/15 PASSED</span></td></tr>
      <tr><td>3</td><td>Model sản phẩm</td><td>TC_031 - TC_048</td><td>18</td><td><span class="badge badge-pass">18/18 PASSED</span></td></tr>
      <tr><td>4</td><td>Biến thể sản phẩm</td><td>TC_049 - TC_065</td><td>17</td><td><span class="badge badge-pass">17/17 PASSED</span></td></tr>
      <tr><td>5</td><td>Nhập kho & IMEI</td><td>TC_066 - TC_085</td><td>20</td><td><span class="badge badge-pass">20/20 PASSED</span></td></tr>
      <tr><td>6</td><td>Xuất kho & Bán hàng</td><td>TC_086 - TC_105</td><td>20</td><td><span class="badge badge-pass">20/20 PASSED</span></td></tr>
      <tr><td>7</td><td>Khách hàng</td><td>TC_106 - TC_118</td><td>13</td><td><span class="badge badge-pass">13/13 PASSED</span></td></tr>
      <tr><td>8</td><td>Nhà cung cấp</td><td>TC_119 - TC_130</td><td>12</td><td><span class="badge badge-pass">12/12 PASSED</span></td></tr>
      <tr><td>9</td><td>Dịch vụ & Bảo hành</td><td>TC_131 - TC_142</td><td>12</td><td><span class="badge badge-pass">12/12 PASSED</span></td></tr>
      <tr><td>10</td><td>Nhân viên</td><td>TC_143 - TC_152</td><td>10</td><td><span class="badge badge-pass">10/10 PASSED</span></td></tr>
      <tr><td>11</td><td>Tài khoản</td><td>TC_153 - TC_160</td><td>8</td><td><span class="badge badge-pass">8/8 PASSED</span></td></tr>
      <tr><td>12</td><td>Vai trò & Phân quyền</td><td>TC_161 - TC_166</td><td>6</td><td><span class="badge badge-pass">6/6 PASSED</span></td></tr>
      <tr><td>13</td><td>Báo cáo Thống kê & Dashboard</td><td>TC_167 - TC_170</td><td>4</td><td><span class="badge badge-pass">4/4 PASSED</span></td></tr>
    </tbody>
