</html>
EOF
            fi
      - store_artifacts:
          path: /tmp/katalon-reports
          destination: katalon-test-reports
      - store_artifacts:
          path: backend.log
          destination: backend-log
      - store_artifacts:
          path: frontend.log
          destination: frontend-log

# ==============================================================================
# WORKFLOWS PIPELINE
# ==============================================================================
workflows:
  version: 2
  build_test_and_deploy:
    jobs:
      - test-backend
      - build-frontend
      - katalon-e2e-testing:
          requires:
            - test-backend
            - build-frontend
